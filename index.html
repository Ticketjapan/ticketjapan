<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶服務系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
        }
        .page {
            display: none;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .active {
            display: block;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 50px;
            width: 100%;
        }
        button {
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .back-btn {
            margin-top: 50px;
            background-color: #6c757d;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <!-- 1. 首頁 (主選單) -->
    <div id="home-page" class="page active">
        <h2>歡迎使用代購服務</h2>
        <div class="btn-container">
            <button onclick="navigateTo('ticket-page')">代購票</button>
            <button onclick="navigateTo('product-page')">商品代購</button>
            <button onclick="redirectToGoogleScript()">代入金</button>
        </div>
    </div>

    <!-- 2. 代購票 空白新頁面 -->
    <div id="ticket-page" class="page">
        <h2>代購票服務</h2>
        <p>內容後補...</p>
        <button class="back-btn" onclick="navigateTo('home-page')">返回首頁</button>
    </div>

    <!-- 3. 商品代購 空白新頁面 -->
    <div id="product-page" class="page">
        <h2>商品代購服務</h2>
        <p>內容後補...</p>
        <button class="back-btn" onclick="navigateTo('home-page')">返回首頁</button>
    </div>

    <script>
        // 頁面轉跳控制邏輯
        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        // 強效外部轉跳邏輯
        function redirectToGoogleScript() {
            var url = "https://script.google.com/macros/s/AKfycbxxNxVr3u2t7mW0KcQ_mY6tNLcNNYkuFA08jyVOm8V_hp3Xn_BNogclbM50JszldqTXsQ/exec";
            window.top.location.href = url;
        }
    </script>
</body>
</html>
