<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketjapan 訂單查詢 </title>
    <style>
        /* 封鎖文字選取複製功能 */
        * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; background-color: #f4f6f8; color: #333; }
        .page { width: 100%; max-width: 450px; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); box-sizing: border-box; border: 1px solid #eaeaea; }
        .logo-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin-bottom: 15px; text-align: center; }
        .logo-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid #eaeaea; background-color: #fff; margin: 0 auto; display: block; }
        h2 { text-align: center; margin-top: 0; margin-bottom: 20px; color: #2c3e50; font-size: 20px; font-weight: 700; }
        .search-box { background: #fdf4ff; border: 1px solid #fbcfe8; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 6px; color: #9d174d; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .search-btn { width: 100%; padding: 14px; background-color: #a21caf; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(162,28,175,0.15); }
        .search-btn:hover { background-color: #86198f; transform: translateY(-1px); }
        .result-box { display: none; margin-top: 20px; padding: 16px; border-radius: 12px; box-sizing: border-box; }
        .status-success { background: #fff0f5; border-left: 4px solid #d81b60; color: #495057; border: 1px solid #f4b2cf; border-left: 4px solid #d81b60; }
        .status-fail { background: #fef2f2; border-left: 4px solid #dc2626; color: #991b1b; border: 1px solid #fecaca; border-left: 4px solid #dc2626; text-align: center; font-weight: bold; }
        .result-title { font-size: 16px; font-weight: bold; border-bottom: 1px dashed #f4b2cf; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; color: #880e4f; }
        .result-item { font-size: 14.5px; line-height: 1.7; margin-bottom: 6px; }
        .result-item strong { color: #1e293b; }
        .whatsapp-btn { display: flex; align-items: center; justify-content: center; background-color: #00BB00; color: #fff; text-decoration: none; padding: 15px; font-size: 16px; font-weight: 600; border-radius: 10px; margin-top: 20px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,187,0,0.2); transition: all 0.2s; }
        .whatsapp-btn:hover { background-color: #009900; transform: translateY(-1px); }
        .back-btn { background-color: #7f8c8d; width: 100%; border: none; padding: 16px; font-size: 16px; font-weight: 600; color: #fff; border-radius: 10px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(127,140,141,0.15); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="page">
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo" class="logo-img" onerror="this.src='logo.png';this.onerror=null;this.src='logo.jpeg';">
        </div>

        <h2>🔍 Ticketjapan 訂單查詢</h2>

        <div class="search-box">
            <div class="form-group">
                <label for="orderId">請輸入編號：</label>
                <input type="text" id="orderId" maxlength="1" oninput="this.value=this.value.replace(/[^a-zA-Z]/g,'').slice(0,1);" autofocus>
            </div>
            <div class="form-group">
                <label for="orderTel">請輸入電話 (TEL)：</label>
                <input type="text" id="orderTel" maxlength="8" pattern="\d*" oninput="this.value=this.value.replace(/[^0-9]/g,'');" inputmode="numeric">
            </div>
            <button class="search-btn" onclick="executeQuery()">訂單查詢</button>
        </div>

        <div id="queryResult" class="result-box"></div>

        <a href="https://wa.me/85291626197" target="_blank" class="whatsapp-btn">💬 Whatsapp聯絡</a>
        <button class="back-btn" onclick="window.location.href='index.html'">返回主選單</button>
    </div>

    <script>
        async function executeQuery() {
            const id = document.getElementById('orderId').value.trim();
            const tel = document.getElementById('orderTel').value.trim();
            const resultBox = document.getElementById('queryResult');

            if (!id || !tel) {
                showMsg("result-box status-fail", "⚠️ 請同時輸入編號及電話號碼");
                return;
            }
            if (id.length !== 1 || tel.length !== 8) {
                showMsg("result-box status-fail", "⚠️ 編號須為1位字母，電話須為8位數字");
                return;
            }

            showMsg("result-box", "⏳ 數據連線中...");
            resultBox.style.background = "#fff0f5";
            resultBox.style.border = "1px solid #f4b2cf";
            resultBox.style.color = "#880e4f";

            try {
                const baseScriptUrl = "https://script.google.com/macros/s/AKfycbx_wX98GL8od4FS-yjoLfiCGGPJGKkUKd59_e7nDlEwx1bAEfZ4fAbNUzmaiW4rQ3HCjA/exec";
                const apiUrl = `${baseScriptUrl}?id=${encodeURIComponent(id)}&tel=${encodeURIComponent(tel)}`;
                
                const response = await fetch(apiUrl);
                const order = await response.json();

                if (order.status === "success") {
                    resultBox.className = "result-box status-success";
                    resultBox.style.textAlign = "left";
                    
                    let linkHtml = (order.link && order.link !== "-") ? `<a href="${order.link}" target="_blank" style="color:#a21caf;text-decoration:underline;font-weight:600;">點擊查看商品連結</a>` : "無相關連結";
                    
                    resultBox.innerHTML = 
                        '<div class="result-title"><span>📋 訂單資料 (' + order.type + ')</span><span style="color:#d81b60;">[' + order.progress + ']</span></div>' +
                        '<div class="result-item"><strong>編號：</strong>' + order.id + '</div>' +
                        '<div class="result-item"><strong>下單日期：</strong>' + order.date + '</div>' +
                        '<div class="result-item"><strong>商品：</strong>' + order.name + '</div>' +
                        '<div class="result-item"><strong>連結：</strong>' + linkHtml + '</div>' +
                        '<div class="result-item" style="margin-top:8px;padding-top:8px;border-top:1px dashed #f4b2cf;"><strong>進度：<br><span style="font-weight:600;color:#880e4f;">💡 ' + order.info + '</span></strong></div>';
                } else {
                    showMsg("result-box status-fail", "❌ " + order.message);
                }
            } catch (error) {
                showMsg("result-box status-fail", "⚠️ 數據庫連線逾時，請點擊下方按鈕聯絡專員。");
            }
        }

        function showMsg(className, text) {
            const r = document.getElementById('queryResult');
            r.className = className;
            r.style.display = "block";
            r.style.textAlign = "center";
            r.innerHTML = text;
        }
    </script>
</body>
</html>
