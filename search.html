<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單查詢系統 - Ticketjapan</title>
    <style>
        /* 封鎖文字選取複製功能 */
        * { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; background-color: #f4f6f8; color: #333; }
        .page { width: 100%; max-width: 450px; background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); box-sizing: border-box; border: 1px solid #eaeaea; }
        .logo-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; margin-bottom: 15px; text-align: center; }
        .logo-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 2px solid #eaeaea; background-color: #fff; margin: 0 auto; display: block; }
        h2 { text-align: center; margin-top: 0; margin-bottom: 20px; color: #2c3e50; font-size: 20px; font-weight: 700; }
        
        /* 查詢表單樣式 */
        .search-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 6px; color: #334155; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .search-btn { width: 100%; padding: 14px; background-color: #2c3e50; color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .search-btn:hover { background-color: #1a252f; transform: translateY(-1px); }
        
        /* 查詢結果卡片樣式 */
        .result-box { display: none; margin-top: 20px; padding: 16px; border-radius: 12px; box-sizing: border-box; }
        .status-success { background: #f0fdf4; border-left: 4px solid #16a34a; color: #166534; border-top: 1px solid #bbf7d0; border-right: 1px solid #bbf7d0; border-bottom: 1px solid #bbf7d0; }
        .status-fail { background: #fef2f2; border-left: 4px solid #dc2626; color: #991b1b; border-top: 1px solid #fecaca; border-right: 1px solid #fecaca; border-bottom: 1px solid #fecaca; text-align: center; font-weight: bold; }
        .result-title { font-size: 16px; font-weight: bold; border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .result-item { font-size: 14.5px; line-height: 1.7; margin-bottom: 6px; }
        .result-item strong { color: #1e293b; }
        
        .whatsapp-btn { display: flex; align-items: center; justify-content: center; background-color: #00BB00; color: #fff; text-decoration: none; padding: 15px; font-size: 16px; font-weight: 600; border-radius: 10px; margin-top: 20px; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,187,0,0.2); transition: all 0.2s; }
        .whatsapp-btn:hover { background-color: #009900; transform: translateY(-1px); }
        .back-btn { background-color: #7f8c8d; width: 100%; border: none; padding: 16px; font-size: 16px; font-weight: 600; color: #fff; border-radius: 10px; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 6px rgba(127,140,141,0.15); }
        .back-btn:hover { background-color: #616a6b; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="page">
        <!-- 頂端置中圓形 LOGO -->
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo" class="logo-img" onerror="this.src='logo.png';this.onerror=null;this.src='logo.jpeg';">
        </div>

        <h2>🔍 訂單查詢系統</h2>

        <!-- 查詢輸入框 -->
        <div class="search-box">
            <div class="form-group">
                <label for="orderId">請輸入訂單編號：</label>
                <input type="text" id="orderId" placeholder="例如: K" autofocus>
            </div>
            <div class="form-group">
                <label for="orderTel">請輸入登記電話 (TEL)：</label>
                <input type="number" id="orderTel" placeholder="例如: 60983510" inputmode="numeric">
            </div>
            <button class="search-btn" onclick="executeQuery()">立即查詢訂單</button>
        </div>

        <!-- 查詢結果動態顯示區域 -->
        <div id="queryResult" class="result-box"></div>

        <!-- WhatsApp 客服按鈕 -->
        <a href="https://bit.ly" target="_blank" class="whatsapp-btn">💬 聯絡客服專員</a>

        <!-- 返回按鈕 -->
        <button class="back-btn" onclick="window.location.href='index.html'">返回主選單</button>
    </div>

    <script>
        async function executeQuery() {
            const id = document.getElementById('orderId').value.trim();
            const tel = document.getElementById('orderTel').value.trim();
            const resultBox = document.getElementById('queryResult');

            if (!id || !tel) {
                resultBox.className = "result-box status-fail";
                resultBox.innerHTML = "⚠️ 請同時輸入編號及電話號碼";
                resultBox.style.display = "block";
                return;
            }

            resultBox.className = "result-box";
            resultBox.style.display = "block";
            resultBox.style.background = "#f1f5f9";
            resultBox.style.border = "1px solid #cbd5e1";
            resultBox.style.color = "#475569";
            resultBox.style.textAlign = "center";
            resultBox.innerHTML = "⏳ 正在即時安全連線數據庫...";

            try {
                // 🔴 請把下方引號內的網址，更換為你在 Apps Script 重新部署後得到的全新「網頁應用程式網址」
                const baseScriptUrl = "https://google.com";
                
                const finalApiUrl = `${baseScriptUrl}?id=${encodeURIComponent(id)}&tel=${encodeURIComponent(tel)}`;
                
                const apiResponse = await fetch(finalApiUrl);
                const order = await apiResponse.json();

                if (order.status === "success") {
                    resultBox.className = "result-box status-success";
                    resultBox.style.textAlign = "left";
                    
                    let linkHtml = order.link && order.link !== "-" ? `<a href="${order.link}" target="_blank" style="color:#0284c7;text-decoration:underline;">點擊查看商品連結</a>` : "無相關連結";
                    
                    resultBox.innerHTML = `
                        <div class="result-title">
                            <span>📋 訂單資料 (${order.type})</span>
                            <span style="color:#15803d;">[${order.progress}]</span>
                        </div>
                        <div class="result-item"><strong>訂單編號：</strong>${order.id}</div>
                        <div class="result-item"><strong>委託日期：</strong>${order.date}</div>
                        <div class="result-item"><strong>代購商品：</strong>${order.name}</div>
                        <div class="result-item"><strong>官方連結：</strong>${linkHtml}</div>
                        <div class="result-item" style="margin-top:8px;padding-top:8px;border-top:1px dashed #bbf7d0;">
                            <strong>最新物流狀況：</strong><br>
                            <span style="font-weight:600;color:#166534;">💡 ${order.info}</span>
                        </div>
                    `;
                } else {
                    resultBox.className = "result-box status-fail";
                    resultBox.innerHTML = `❌ ${order.message}`;
                }
            } catch (error) {
                console.error(error);
                resultBox.className = "result-box status-fail";
                resultBox.innerHTML = "⚠️ 數據庫安全封鎖或連線逾時，請直接點擊下方按鈕聯絡專員處理。";
            }
        }
    </script>
</body>
</html>
